version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hillfort_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_prod_password}
      POSTGRES_DB: ${DB_NAME:-hillfort_sms_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - hillfort-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hillfort_sms_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hillfort_redis_prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-secure_redis_password}
    volumes:
      - redis_prod_data:/data
    networks:
      - hillfort-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secure_redis_password}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: hillfort_api_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-secure_prod_password}@postgres:5432/${DB_NAME:-hillfort_sms_prod}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-secure_redis_password}@redis:6379
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hillfort-net

  web-admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
    container_name: hillfort_admin_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - hillfort-net

  web-portal:
    build:
      context: ..
      dockerfile: docker/Dockerfile.portal
    container_name: hillfort_portal_prod
    restart: always
    ports:
      - "81:80"
    depends_on:
      - api
    networks:
      - hillfort-net

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  hillfort-net:
    driver: bridge